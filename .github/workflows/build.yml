name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with the built jars'
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly: Monday 02:00 UTC - tracks the latest upstream Slimefun.
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  build:
    name: Build (default + slim)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (incl. upstream submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Follow the latest upstream Slimefun experimental HEAD.
      - name: Track latest upstream
        run: |
          git submodule update --init upstream
          git -C upstream fetch origin experimental
          git -C upstream checkout --force origin/experimental

      - name: Build (default = 1:1 upstream parity, all languages)
        run: ./build.sh --skip-checkout -Dmaven.test.skip=true

      - name: Build (slim = en/zh languages + tuned config.yml)
        run: ./build.sh --skip-checkout -Pslim -Dmaven.test.skip=true

      - name: Record upstream commit
        run: |
          echo "UPSTREAM=$(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slimefun-${{ env.UPSTREAM }}-${{ env.BUILD_DATE }}
          path: |
            dist/*.jar
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-${{ github.run_number }}"
          gh release create "$TAG" dist/*/*.jar \
            --generate-notes \
            --title "Slimefun woven build #${{ github.run_number }}" \
            --latest=false
